<div class="chips" style="margin-top:10px">${[["lec","Lectures"],["nt","Notes"],["pyq","PYQ"]].map(([k,l])=>`<button class="chip ${tb==k?"on":""}" onclick="tb='${k}';render()">${l}</button>`).join("")}</div>

tb=="nt"?cur.ch.map((x,i)=>`<div class="cd r"><div><b>📄 ${x} - Notes</b><div class="mu">PDF · handwritten</div></div><span>${b?"⬇":"🔒"}</span></div>`).join(""):
`<button class="btn w" onclick="stT('p','${cur.s}')">Is subject ke PYQ practice karein</button>`}`}
const l=D.courses.filter(c=>c.cls==cls);
return `<h1>Courses</h1><div class="chips">${[11,12].map(x=>`<button class="chip ${cls==x?"on":""}" onclick="cls=${x};render()">Class ${x}</button>`).join("")}</div>${l.map(ccard).join("")}
<h2>🔖 Bookmarks</h2>${Object.keys(U.bm).filter(k=>U.bm[k]).map(k=>{const[c,i]=k.split("_"),co=D.courses.find(x=>x.id==c);return co?`<div class="cd">${co.ch[i]} <span class="mu">· ${co.s}</span></div>`:""}).join("")||'<p class="mu">Lecture par ＋ dabakar bookmark karein.</p>'}`}
function stT(m,s){const q=(s?ALL.filter(x=>x.s==s):[...ALL].sort(()=>Math.random()-.5));T={m,q,i:0,a:q.map(()=>null),st:Date.now(),left:600,sub:s||"Mock",done:false};clearInterval(tmr);tab="prac";view=null;cur=null;
if(m=="m")tmr=setInterval(()=>{T.left--;const e=$("tm");if(e)e.textContent=fmt(T.left);if(T.left<=0)sub_()},1000);render()}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function pk(j){if(T.m=="p"&&T.a[T.i]!=null)return;T.a[T.i]=j;if(T.m=="p")xp(j==T.q[T.i].a?10:2);render()}
function sub_(){clearInterval(tmr);T.done=true;T.tt=Math.round((Date.now()-T.st)/1000);const c=T.q.filter((x,i)=>T.a[i]==x.a).length;xp(c*5);U.scores.push({s:T.sub,m:c,t:T.q.length});save();render();if(S)rest("test_results",{m:"POST",b:{user_id:S.user.id,subject:T.sub,score:c,total:T.q.length},h:{Prefer:"return=minimal"}}).catch(()=>{})}
function prac(){
if(T){const n=T.q.length;
if(T.done||T.i>=n&&T.m=="p"){const c=T.q.filter((x,i)=>T.a[i]==x.a).length,w=T.q.map((x,i)=>[x,i]).filter(([x,i])=>T.a[i]!=x.a);
const bs=SUB.map(s=>{const z=T.q.map((x,i)=>[x,i]).filter(([x])=>x.s==s);return z.length?[s,Math.round(z.filter(([x,i])=>T.a[i]==x.a).length/z.length*100)]:null}).filter(Boolean);
return `<h1>Result</h1><div class="hero"><div class="r"><div><div class="b" style="font-size:28px">${c}/${n}</div><div class="mu">Accuracy ${Math.round(c/n*100)}% · +${c*5} XP</div></div><div class="mu">${T.tt!=null?"Time "+fmt(T.tt):""}</div></div></div>
<h2>Subject analysis</h2><div class="cd">${bs.map(([s,v])=>`<div class="r"><span>${s}</span><b>${v}%</b></div><div class="bar" style="margin:4px 0 8px"><i style="width:${v}%"></i></div>`).join("")}</div>
<h2>Galat jawab (review)</h2>${w.map(([x,i])=>`<div class="cd"><div class="b">${x.q}</div><div style="color:var(--ok)">✓ ${x.o[x.a]}</div><div class="mu">${T.a[i]==null?"Skip kiya":"Aapka: "+x.o[T.a[i]]}</div></div>`).join("")||"<p>Sab sahi! 🔥</p>"}
<button class="btn w" onclick="T=null;render()">Done</button>`}
const q=T.q[T.i],a=T.a[T.i];
return `<div class="r"><span class="mu">${q.s} · Q${T.i+1}/${n}</span>${T.m=="m"?`<b id="tm">${fmt(T.left)}</b>`:""}</div>
<h2>${q.q}</h2>${q.o.map((o,j)=>{let c="";if(T.m=="p"&&a!=null)c=j==q.a?"ok":j==a?"bad":"";else if(a==j)c="sel";return `<button class="opt ${c}" onclick="pk(${j})">${o}</button>`}).join("")}
${T.m=="m"?`<div class="pal">${T.q.map((_,i)=>`<button class="${T.a[i]!=null?"a":""} ${i==T.i?"c":""}" onclick="T.i=${i};render()">${i+1}</button>`).join("")}</div><div class="g">${T.i>0?`<button class="btn o" onclick="T.i--;render()">Prev</button>`:""}${T.i<n-1?`<button class="btn" onclick="T.i++;render()">Next</button>`:`<button class="btn" onclick="sub_()">Submit</button>`}</div>`
:`${a!=null?`<button class="btn w" onclick="T.i++;render()">${T.i<n-1?"Next":"Result"}</button>`:""}`}
<button class="btn o w" style="margin-top:10px" onclick="clearInterval(tmr);T=null;render()">Quit</button>`}
return `<h1>Practice</h1><div class="hero"><div class="b">Full Mock Test</div><div class="mu">${ALL.length} questions · 10 min · detailed analysis</div><button class="btn w" style="background:#fff;color:#5b4bf0;margin-top:10px" onclick="stT('m')">Start mock</button></div>
<h2>PYQ practice (instant feedback)</h2>${SUB.map(s=>`<div class="cd r"><div><b>${IC[s]} ${s}</b><div class="mu">${ALL.filter(x=>x.s==s).length} PYQs</div></div><button class="btn" onclick="stT('p','${s}')">Practice</button></div>`).join("")}
<h2>Recent scores</h2>${U.scores.slice(-5).reverse().map(x=>`<div class="cd r"><span>${x.s}</span><b>${x.m}/${x.t}</b></div>`).join("")||'<p class="mu">Abhi koi test nahi diya.</p>'}`}
function dbt(){return `<h1>Doubts</h1><p class="mu">Teacher se seedha poochhein. (Asli app me AI Guru 24/7 jawab dega.)</p><div class="cd"><select id="ds">${SUB.map(s=>`<option>${s}</option>`).join("")}</select><textarea id="dq" rows="3" placeholder="Apna doubt likhein..."></textarea><button class="btn w" onclick="askD()">Doubt bhejein</button></div>
${D.doubts.map(d=>`<div class="cd"><span class="tag">${d.s}</span> <span class="mu">${d.n}</span><div class="b" style="margin:4px 0">${d.q}</div>${d.a?`<div style="border-left:3px solid var(--ok);padding-left:8px">👨‍🏫 ${d.a}</div>`:'<div class="mu">⏳ Teacher ka jawab aana baaki</div>'}</div>`).join("")}`}
function me(){
if(view=="adm")return adm();
return `<h1>Profile</h1><div class="cd"><input id="nm" value="${U.name}" placeholder="Aapka naam"><button class="btn w" onclick="U.name=$('nm').value;save();syncP();render()">Save</button></div>
<div class="cd r"><span>Level ${lvl()} · ${U.xp} XP</span><span>Streak: ${U.streak} days</span></div>
<div class="cd r"><span>Dark mode</span><button class="btn o" onclick="U.dark=U.dark?0:1;save();render()">${U.dark?"On":"Off"}</button></div><div class="cd mu">Parent report, asli OTP, offline download aur notifications backend ke baad judenge.</div>
${U.role=="admin"?`<button class="btn o w" onclick="view='adm';render()">Admin / Teacher panel</button>`:""}<button class="btn o w" style="margin-top:8px" onclick="S=null;put('cw_s',null);U.ok=0;OB=0;admin=false;save();render()">Logout</button>`}
function adm(){
if(!admin)return `<button class="btn o" onclick="view=null;render()">← Back</button><h1 style="margin-top:10px">Admin login</h1><div class="cd"><input id="pin" type="password" placeholder="PIN (demo: 1234)"><button class="btn w" onclick="if($('pin').value=='1234'){admin=true;render()}else alert('Galat PIN')">Login</button></div>`;
return `<button class="btn o" onclick="view=null;render()">← Back</button><h1 style="margin-top:10px">Admin panel</h1><div class="g"><div class="cd"><div class="mu">Students</div><div class="b">${D.stu}</div></div><div class="cd"><div class="mu">Revenue</div><div class="b">₹${D.rev}</div></div></div>
<h2>Live class set karein</h2><div class="cd"><input id="lt" value="${D.live.t}"><input id="lm" value="${D.live.tm}"><button class="btn w" onclick="updLive()">Update live</button></div>
<h2>Naya course</h2><div class="cd"><input id="ct" placeholder="Title"><div class="g"><select id="cc"><option>11</option><option selected>12</option></select><select id="cs">${SUB.map(s=>`<option>${s}</option>`).join("")}</select></div><input id="cp" type="number" placeholder="Price ₹"><input id="cch" placeholder="Chapters (comma se)"><button class="btn w" onclick="addC()">Add course</button></div>
<h2>Courses</h2>${D.courses.length?"":'<button class="btn w" onclick="seed()">Sample courses load karein</button>'}${D.courses.map(c=>`<div class="cd r"><div><b>${c.t}</b><div class="mu">₹${c.p}</div></div><button class="btn o" onclick="delC(${c.id})">🗑</button></div>`).join("")}
<h2>Doubts reply</h2>${D.doubts.filter(d=>!d.a).map(d=>`<div class="cd"><div class="b">${d.q}</div><input id="r${d.id}" placeholder="Jawab likhein"><button class="btn w" onclick="repD(${d.id})">Reply</button></div>`).join("")||'<p class="mu">Koi pending doubt nahi.</p>'}
`}
async function addC(){const t=$("ct").value.trim();if(!t||!$("cp").value)return alert("Title aur price bharein");try{const r=await rest("courses",{m:"POST",b:{class:+$("cc").value,subject:$("cs").value,title:t,price:+$("cp").value},h:{Prefer:"return=representation"}});const ch=($("cch").value||"Chapter 1").split(",").map((x,i)=>({course_id:r[0].id,position:i+1,title:x.trim(),is_free:i==0}));await rest("chapters",{m:"POST",b:ch,h:{Prefer:"return=minimal"}});await boot();render()}catch(e){alert(e.message)}}
async function askD(){const q=$("dq").value.trim();if(!q)return;try{const r=await rest("doubts",{m:"POST",b:{user_id:S.user.id,subject:$("ds").value,question:q},h:{Prefer:"return=representation"}});D.doubts.unshift({id:r[0].id,n:U.name||"You",s:r[0].subject,q,a:""});xp(5);render()}catch(e){alert(e.message)}}
async function delC(id){if(!confirm("Delete karein?"))return;try{await rest("courses?id=eq."+id,{m:"DELETE"});await boot();render()}catch(e){alert(e.message)}}
async function updLive(){try{await rest("live_class?id=eq.1",{m:"PATCH",b:{title:$("lt").value,starts_at:$("lm").value},h:{Prefer:"return=minimal"}});D.live.t=$("lt").value;D.live.tm=$("lm").value;alert("Live update ho gaya")}catch(e){alert(e.message)}}
async function repD(id){const v=$("r"+id).value.trim();if(!v)return;try{await rest("doubts?id=eq."+id,{m:"PATCH",b:{answer:v},h:{Prefer:"return=minimal"}});D.doubts.find(x=>x.id==id).a=v;render()}catch(e){alert(e.message)}}
async function seed(){try{for(const c of SEED().courses){const r=await rest("courses",{m:"POST",b:{class:c.cls,subject:c.s,title:c.t,price:c.p},h:{Prefer:"return=representation"}});await rest("chapters",{m:"POST",b:c.ch.map((x,i)=>({course_id:r[0].id,position:i+1,title:x,is_free:i==0})),h:{Prefer:"return=minimal"}})}await boot();render()}catch(e){alert(e.message)}}
let OB=0;
function onb(){const su=OB==1;return `<div style="padding:28px 2px"><div class="lg">C</div><h1 style="font-size:26px;margin-top:16px">Commerce wale sir</h1><p class="mu">Class 11 aur 12 Commerce ki complete taiyari: live classes, notes, PYQ aur mock tests.</p><div class="cd" style="margin-top:18px">${su?`<input id="on" placeholder="Aapka naam"><input id="om" type="tel" maxlength="10" placeholder="Mobile number"><select id="oc"><option value="12">Class 12</option><option value="11">Class 11</option></select>`:""}<input id="oe" type="email" placeholder="Email"><input id="op" type="password" placeholder="Password (min 6 akshar)"><button class="btn w" id="ob" onclick="auth()">${su?"Account banayein":"Login"}</button><p class="mu" style="text-align:center;margin:10px 0 0" onclick="OB=${su?0:1};render()"><u>${su?"Pehle se account hai? Login":"Naya account banayein"}</u></p></div></div>`}
async function auth(){const su=OB==1,e=$("oe").value.trim(),pw=$("op").value;if(!e||pw.length<6)return alert("Email aur 6+ akshar ka password daalein");let n,m;if(su){n=$("on").value.trim();m=$("om").value.trim();if(!n||!/^\d{10}$/.test(m))return alert("Naam aur 10 digit mobile daalein")}
$("ob").disabled=true;try{let r;if(su){r=await raw("/auth/v1/signup",{m:"POST",anon:1,b:{email:e,password:pw,data:{name:n,phone:m}}});if(r.ok&&!(r.j&&r.j.access_token)){alert("Account ban gaya. Email par confirmation link gaya hai, use kholkar Login karein.");OB=0;return render()}}else r=await raw("/auth/v1/token?grant_type=password",{m:"POST",anon:1,b:{email:e,password:pw}});
if(!r.ok)throw new Error((r.j&&(r.j.msg||r.j.error_description||r.j.message))||"Login fail");S=r.j;put("cw_s",S);if(su){U.name=n;U.ph=m;U.cl=+$("oc").value}U.ok=1;await boot();if(su)syncP();save();render()}catch(x){alert(x.message);if($("ob"))$("ob").disabled=false}}
const topbar=()=>`<div class="tb"><div><div class="lg s">C</div><b style="font-size:17px">Commerce wale sir</b></div><div><span class="pill">${U.last==day()||U.last==day(1)?U.streak:0} day</span><span class="pill">Class ${U.cl||cls}</span></div></div>`;
function ap(){U.dark?document.documentElement.setAttribute("data-theme","dark"):document.documentElement.removeAttribute("data-theme")}
function render(){ap();if(U.cl&&!window._c){cls=U.cl;window._c=1}if(!U.ok){$("nav").innerHTML="";$("app").innerHTML=onb();return}nav();$("app").innerHTML=topbar()+{home,learn,prac,dbt,me}[tab]();if(!T||T.done)scrollTo(0,0)}
if(U.ok&&!S)U.ok=0;render();if(U.ok)boot().then(render);
</script></body></html>
